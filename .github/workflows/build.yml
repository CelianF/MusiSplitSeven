name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to publish a GitHub Release for v* tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MUSISPLIT_MODEL_DIR: ${{ github.workspace }}\.model
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Fetch ffmpeg
        run: pwsh scripts/fetch_ffmpeg.ps1

      - name: Cache model
        uses: actions/cache@v6
        with:
          path: .model
          key: htdemucs-onnx-68d0bf16428ef66e692cdff8a9ccf28f1ef3f69440d57e58605a4cc55fcc5e74

      - name: Download model (for tests only; the app downloads it on first launch)
        run: python -c "from musisplit.model import ensure_model; print(ensure_model())"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean MusiSplitSeven.spec

      - name: Check bundled runtime DLLs
        shell: pwsh
        run: |
          # The friend's PC may not have the Visual C++ runtime installed.
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $found = Get-ChildItem -Recurse -Filter $dll dist/MusiSplitSeven | Select-Object -First 1
            if (-not $found) { throw "$dll is not bundled" }
            Write-Host "ok $dll -> $($found.FullName)"
          }

      - name: Smoke test the build from a clean folder
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP "clean"
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          Copy-Item -Recurse dist/MusiSplitSeven $clean
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $env:PATH = "C:\Windows\System32;C:\Windows"  # no ffmpeg or Python on PATH
          $p = Start-Process -FilePath (Join-Path $clean "MusiSplitSeven\MusiSplitSeven.exe") `
                -ArgumentList "--self-test", "`"$report`"", "--net" `
                -WorkingDirectory $clean -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $version = python -c "import musisplit; print(musisplit.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup, preinstalled on the runner)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item installer\*.exe | Select-Object Name, Length

      - name: Smoke test the installer (install, self-test, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-Item installer\*-Setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "installed"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $exe = Join-Path $dir "MusiSplitSeven.exe"
          if (-not (Test-Path $exe)) { throw "MusiSplitSeven.exe not installed" }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "MusiSplitSeven.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut missing: $shortcut" }

          $report = Join-Path $env:RUNNER_TEMP "selftest-installed.txt"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process $exe -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "installed self-test failed: $($p.ExitCode)" }

          $p = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 3  # the uninstaller finishes from a temp copy
          if (Test-Path $exe) { throw "uninstall left MusiSplitSeven.exe behind" }
          if (Test-Path $shortcut) { throw "uninstall left the Start menu shortcut" }
          Write-Host "install / self-test / uninstall OK"

      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path dist/MusiSplitSeven -DestinationPath "MusiSplitSeven-${{ steps.ver.outputs.version }}-portable.zip"

      # GitHub zips artifacts itself: upload the plain files, not our zip, to avoid a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          name: MusiSplitSeven-${{ steps.ver.outputs.version }}-Setup
          path: installer/*-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: MusiSplitSeven-${{ steps.ver.outputs.version }}-portable
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "tag ${{ github.ref_name }} doesn't match app version $version (musisplit/__init__.py)"
          }
          $notes = "**Download ``MusiSplitSeven-$version-Setup.exe`` and double-click it.** No admin rights needed.`n`n" +
                   "The ``-portable.zip`` is the same app without installer (extract and run ``MusiSplitSeven.exe``)."
          gh release create "${{ github.ref_name }}" `
            (Get-Item installer\*-Setup.exe).FullName `
            "MusiSplitSeven-$version-portable.zip" `
            --title "MusiSplitSeven $version" --notes "$notes" --generate-notes
